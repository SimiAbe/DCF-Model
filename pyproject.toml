[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcf-model"
version = "0.1.0"
description = "A small, dependency-free discounted cash flow (DCF) valuation model with a CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Similoluwa Abe" }]
keywords = ["dcf", "valuation", "finance", "wacc", "discounted cash flow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dcf = "dcf.cli:main"

[tool.setuptools]
packages = ["dcf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
